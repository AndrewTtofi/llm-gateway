[project]
name = "llm-gateway"
version = "1.0.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Bench tooling: fixed-argv subprocess calls to docker, long report table strings,
# psql queries built from uuid.UUID()-validated key ids.
"tests/load/*" = ["S603", "S607", "E501", "S608"]  # S608: ids are uuid.UUID()-validated

[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: calls real provider APIs (costs money)",
  "e2e: needs the running stack (make up) + Ollama; free",
]
