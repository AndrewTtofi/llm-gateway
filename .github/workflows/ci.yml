name: ci
on:
  push: { branches: [main] }
  pull_request:

# Least privilege: the token can only read the repo. No secrets are used, so PRs from
# forks run with nothing worth stealing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Redis so the circuit-breaker Lua scripts are tested, not mocked.
    # Keep the tags in sync with docker-compose.yml (Dependabot only bumps that one).
    services:
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s
          --health-retries 15
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_USER: gateway, POSTGRES_PASSWORD: gateway, POSTGRES_DB: gateway_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway_test
      REQUIRE_REDIS: "1"      # fail, don't skip, if Redis is missing
      REQUIRE_POSTGRES: "1"   # same for Postgres
    steps:
      # Actions pinned to commit SHAs (a tag can be moved; a SHA can't). Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests && mypy app
      - run: make test
      - name: lockfiles match requirements
        run: make lock && git diff --exit-code -- requirements.txt requirements-dev.txt
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t llm-gateway .
