name: release
# On a v* tag: build the gateway image for amd64 + arm64, push it to GHCR with an SBOM and
# build provenance, and attest it, so production runs exactly what CI built.
#
# Only GitHub-owned actions run here: the repo allows no third-party actions. The Docker
# steps use the docker CLI and buildx plugin preinstalled on the runner instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write       # push to ghcr.io/<owner>/<repo>
  id-token: write       # keyless signing of the provenance attestation
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions and images pinned to digests (a tag can be moved; a digest can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"            # GHCR needs lowercase
          version="${GITHUB_REF_NAME#v}"                     # v1.3.1 → 1.3.1
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $GITHUB_REF_NAME"; exit 1; }
          {
            echo "image=$image"
            echo "tags=-t $image:$version -t $image:${version%.*} -t $image:sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Emulate arm64 (QEMU)
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64

      - name: Builder
        # The docker-container driver: needed for multi-platform builds and attestations.
        run: docker buildx create --use --name release --driver docker-container

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        id: build
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # shellcheck disable=SC2086  # TAGS is a list of -t flags
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file metadata.json \
            --push
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [[ "$digest" == sha256:* ]] || { echo "no image digest in metadata.json"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Log out
        if: always()
        run: docker logout ghcr.io
