# Bench rig (docker-compose.bench.yml): both gateway replicas. In a real multi-replica
# deployment use service discovery (kubernetes_sd, dns_sd, ecs …) instead of a list.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100", "gateway2:9100"]
