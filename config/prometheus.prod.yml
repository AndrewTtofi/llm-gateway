global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]   # SLOs + alerts (config/prometheus-rules.yml)
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]   # routes them to Slack (or similar)
scrape_configs:
  - job_name: gateway
    # Every replica: the service name resolves to all of them (a static target would
    # only reach one at random).
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 9100
