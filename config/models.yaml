# Model registry — the ONLY place models are named.
# Timeouts (seconds): connect · first_token = wait for the first stream event ·
# stream_idle = max silence between stream events (thinking models pause long) ·
# stream_total = hard cap on a whole stream · total = non-streaming read (the whole
# answer arrives at once) · pool = wait for a free connection when all are busy.
# limits: connection pool size per provider (requests beyond it wait `pool` seconds).
# Change a model: edit here, then `make reload` (no restart, no code change).
# Verify current model IDs in each provider's docs before adding them.

providers:
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    timeouts: { connect: 5, first_token: 30, stream_idle: 300, stream_total: 900, total: 300, pool: 5 }
    limits: { max_connections: 100, max_keepalive: 20 }
    default_max_tokens: 16000   # Anthropic requires max_tokens; used when the client omits it
    # What each model accepts. The adapter translates OpenAI params accordingly.
    # Check the provider's model docs when adding a model; unlisted models get `defaults`.
    #   sampling           temperature / top_p accepted (newer models 400 on them → dropped)
    #   forced_tool_choice tool_choice "required"/named accepted (else → auto + instruction)
    #   effort             output_config.effort (OpenAI reasoning_effort) accepted
    #   refusal_fallback   server-side refusal fallback (beta) enabled for this model
    defaults: { sampling: true, forced_tool_choice: true, effort: false, refusal_fallback: false }
    models:
      claude-opus-5-5:           { sampling: false, forced_tool_choice: false, effort: true, refusal_fallback: true }
      claude-sonnet-5-5:         { sampling: false, forced_tool_choice: false, effort: true, refusal_fallback: true }
      claude-haiku-4-5-20251001: { sampling: true,  forced_tool_choice: true,  effort: false }
      # Anthropic's top model (GA 2026-09-01). Rejects sampling params, forced tool_choice,
      # prefill and disabling thinking; refusal fallback goes to Anthropic's permitted models.
      claude-fable-5-1:          { sampling: false, forced_tool_choice: false, effort: true, refusal_fallback: true }
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeouts: { connect: 5, first_token: 30, stream_idle: 120, stream_total: 900, total: 300, pool: 5 }
    limits: { max_connections: 100, max_keepalive: 20 }
    # What each "OpenAI-compatible" API accepts differs; see ADR 0012 and openai_compat.py.
    params:
      # max_tokens is legacy on reasoning models; api.openai.com accepts the new name on all
      # current chat models. (An older OpenAI-compatible proxy might not.)
      rename: { max_tokens: max_completion_tokens }
    models:
      # GPT-6 reasoning models: no sampling params; effort can't be "none". Tool calling
      # needs the Responses API, so they're called through it (ADR 0014). For "pro"
      # reasoning, add a model entry with `reasoning_mode: pro` once its price is known.
      gpt-6-astra:
        api: responses
        params:
          drop: [temperature, top_p, logprobs, top_logprobs]
          values: { reasoning_effort: [low, medium, high, xhigh, max] }
      gpt-6.1-sol:
        api: responses
        params:
          drop: [temperature, top_p, logprobs, top_logprobs]
          values: { reasoning_effort: [low, medium, high, xhigh, max] }
  gemini:                 # Google, through its OpenAI-compatibility layer (itself beta)
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    timeouts: { connect: 5, first_token: 60, stream_idle: 300, stream_total: 1800, total: 600, pool: 5 }
    limits: { max_connections: 100, max_keepalive: 20 }
    params:
      values: { reasoning_effort: [minimal, low, medium, high] }   # thinking can't be turned off
    models:
      gemini-3.1-pro-preview: {}   # preview: Google has no GA 3.1 Pro yet
  xai:
    type: openai
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    timeouts: { connect: 5, first_token: 60, stream_idle: 300, stream_total: 1800, total: 600, pool: 5 }
    limits: { max_connections: 100, max_keepalive: 20 }
    params:
      # Reasoning models reject these (stop sequences are dropped, not honoured).
      drop: [presence_penalty, frequency_penalty, stop]
      values: { reasoning_effort: [low, medium, high, xhigh] }
    models:
      grok-4.7: {}
  mistral:
    type: openai
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    stream_usage: false   # stream_options isn't a Mistral parameter; usage arrives anyway
    timeouts: { connect: 5, first_token: 60, stream_idle: 300, stream_total: 1800, total: 600, pool: 5 }
    limits: { max_connections: 100, max_keepalive: 20 }
    params:
      # Mistral rejects unknown fields (422), so only its documented ones are sent.
      # reasoning_effort is left out: with it, content arrives as a list of chunks.
      allow: [max_tokens, temperature, top_p, stop, random_seed, response_format, tools,
              tool_choice, parallel_tool_calls, presence_penalty, frequency_penalty, n]
      rename: { max_completion_tokens: max_tokens, seed: random_seed }
    models:
      mistral-medium-3-5-26-04: {}   # Mistral Medium 3.5, the flagship (pinned ID)
  deepseek:
    type: openai
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeouts: { connect: 5, first_token: 60, stream_idle: 300, stream_total: 1800, total: 600, pool: 5 }
    limits: { max_connections: 100, max_keepalive: 20 }
    params:
      rename: { max_completion_tokens: max_tokens }
      values: { reasoning_effort: [none, low, high, max] }
    models:
      # V4.1 Flash: DeepSeek says it beats V4-Pro, which is being phased out.
      deepseek-flash: {}
  ollama:
    type: openai          # Ollama exposes an OpenAI-compatible API
    base_url: ${OLLAMA_BASE_URL}
    api_key_env: null
    timeouts: { connect: 2, first_token: 60, stream_idle: 120, stream_total: 1200, total: 600, pool: 5 }
    limits: { max_connections: 20, max_keepalive: 5 }
  fake:                   # chaos provider for tests and demos — never in production aliases
    type: fake
    timeouts: { first_token: 10, stream_total: 60 }
    # Each "model" is a failure profile:
    #   failure_rate      share of calls that fail before the first token
    #   fail_status       statuses to fail with (random pick)
    #   latency_ms        [min, max] added before answering
    #   mid_stream_failure_rate  share of streams that die after the first chunk
    #   chunk_delay_ms    pause between streamed chunks
    #   down_window       { period_s, down_s }: fails for the first down_s of every period_s
    #                     (an outage that comes back — for watching the breaker recover)
    models:
      ok:     { failure_rate: 0.0, latency_ms: [5, 20] }
      flaky:  { failure_rate: 0.3, fail_status: [429, 500, 503], latency_ms: [50, 300] }
      down:   { failure_rate: 1.0, fail_status: [503] }
      slow:   { failure_rate: 0.0, latency_ms: [3000, 5000] }
      blip:   { down_window: { period_s: 60, down_s: 20 }, fail_status: [503] }
      broken-stream: { mid_stream_failure_rate: 1.0 }
      metered: {}             # always works; priced in pricing.yaml to exercise budgets

  bench:                  # mock LLM for load tests (tests/load/mockllm.py) — dev only
    type: openai
    dev_only: true          # loaded only with GATEWAY_ENABLE_FAKE=1, like `fake`
    base_url: http://mockllm:8080/v1
    api_key_env: null
    timeouts: { connect: 2, first_token: 5, stream_idle: 10, stream_total: 120, total: 60, pool: 5 }
    limits: { max_connections: 2000, max_keepalive: 500 }
    models: { fast: {}, realistic: {}, long: {}, slow: {}, primary: {}, backup: {} }

# Aliases are what clients send as `model`. Each is an ordered fallback chain.
aliases:
  # The strongest model from each company, best first. Providers without a key are skipped.
  frontier:
    chain:
      - anthropic/claude-fable-5-1
      - anthropic/claude-opus-5-5
      - openai/gpt-6-astra
      - gemini/gemini-3.1-pro-preview
      - xai/grok-4.7
      - mistral/mistral-medium-3-5-26-04
      - deepseek/deepseek-flash
  fast:
    chain:
      - anthropic/claude-haiku-4-5-20251001
      - openai/gpt-6-luna
      - ollama/llama3.2:3b
  smart:
    chain:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
      - openai/gpt-6-astra
  balanced:
    chain:
      - anthropic/claude-sonnet-5-5
      - openai/gpt-6.1-sol
      - ollama/llama3.2:3b
  local:
    chain:
      - ollama/llama3.2:3b
  chaos:            # 30% failures on the primary; fallback hides them
    chain:
      - fake/flaky
      - ollama/llama3.2:3b
  chaos-down:       # primary always down: the breaker opens, traffic flows to the fallback
    chain:
      - fake/down
      - fake/ok
  chaos-blip:       # primary down 20s of every minute: watch the breaker open and recover
    chain:
      - fake/blip
      - fake/ok
  # Phase 6 benchmarks (bench provider, dev only)
  bench-fast:      { chain: [bench/fast] }
  bench-realistic: { chain: [bench/realistic] }
  bench-long:      { chain: [bench/long] }
  bench-ha:        { chain: [bench/primary, bench/backup] }
  bench-slow:      { chain: [bench/slow, bench/backup] }

# Allow clients to request `provider/model` directly (bypassing aliases)?
allow_direct_models: true

# Retry the same target before falling back to the next one (ADR 0004).
retry:
  max_attempts_per_provider: 2          # 1 = no retries
  backoff_base_ms: 250                  # full jitter: sleep random(0, min(max, base * 2^n))
  backoff_max_ms: 4000                  # a longer retry-after skips to the next target
  retry_on_status: [408, 409, 429, 500, 502, 503, 504, 529]

# One breaker per provider/model target (ADR 0004).
circuit_breaker:
  store: redis              # redis (shared across instances) | memory (single process)
  failure_threshold: 5      # failures within window to open
  window_seconds: 60
  open_seconds: 30          # then half-open: one probe request
  probe_timeout_seconds: 330 # longer than the slowest call (timeouts.total), or a slow
                             # but healthy probe would let a second probe through
  redis_timeout_ms: 100      # Redis is a LAN hop. On errors the breaker fails open and
                             # skips Redis for 5s, so an outage doesn't slow every request
